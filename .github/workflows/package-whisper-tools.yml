name: Package temporary transcription tools

on:
  push:
    branches:
      - chatgpt-whisper-tools
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download whisper.cpp CPU binary
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 3 \
            https://github.com/sjoerdteunisse/whisper.cpp/releases/download/v1.0.0/whisper-cpp-linux-x64-cpu.zip \
            -o /tmp/whisper.zip
          unzip -j /tmp/whisper.zip -d bundle
          chmod +x bundle/whisper-cli || true
      - name: Download English small quantized model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin?download=true' \
            -o bundle/ggml-small.en-q5_1.bin
          ls -lh bundle
      - name: Upload tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tools
          path: bundle/
          compression-level: 0
          retention-days: 1
